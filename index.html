<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체스도쿠 - Chessdoku</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('image/background.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .logo {
            margin-bottom: 60px;
            text-align: center;
        }

        .logo h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 3px 3px 25px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        .logo p {
            font-size: 1.5rem;
            color: #e0e0e0;
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.8);
        }

        .download-button {
            margin-bottom: 80px;
        }

        .download-button a {
            display: inline-block;
            padding: 20px 60px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .download-button a:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.5);
            background: #5ba3f5;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.3);
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: scale(1.05);
        }

        .social-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .contact {
            color: #e0e0e0;
            font-size: 1rem;
            text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.8);
        }

        .contact a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }

        .contact a:hover {
            border-bottom-color: white;
        }

        .game-description {
            max-width: 600px;
            text-align: center;
            color: white;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .game-description p {
            font-size: 1.2rem;
            line-height: 1.6;
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.9);
            color: #f0f0f0;
        }

        @media (max-width: 768px) {
            .logo h1 {
                font-size: 2.5rem;
            }

            .logo p {
                font-size: 1.2rem;
            }

            .download-button a {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .social-links {
                flex-direction: column;
                gap: 15px;
            }

            .game-description p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="logo">
            <h1>체스도쿠</h1>
            <p>Chessdoku</p>
        </div>

        <div class="game-description">
            <p>체스 + 스도쿠. 상대보다 먼저 체스 말을 움직여 스도쿠를 완성하는 1대1 보드 게임.</p>
        </div>

        <div class="download-button">
            <a href="#" id="downloadBtn">데모 다운로드</a>
        </div>

        <div class="social-links">
            <a href="https://x.com/chessdoku_" target="_blank" rel="noopener">

                Reddit

        </div>

        <div class="contact">
            문의: <a href="mailto:chessdoku.official@gmail.com">chessdoku.official@gmail.com</a>
        </div>
    </div>

        // 다운로드 버튼 클릭 이벤트

</body>
